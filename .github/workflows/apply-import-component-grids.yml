name: Apply Import Component Grids

on:
  push:
    branches:
      - feature/apple-cutter-model
    paths:
      - .github/workflows/apply-import-component-grids.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/apple-cutter-model

      - name: Apply component-grid correction
        shell: python
        run: |
          from pathlib import Path

          source_path = Path('src/editor/snapping/objectSurfaceSnap.ts')
          source = source_path.read_text(encoding='utf-8')
          old = """  const meshChildren = root.children.filter((child) => child.visible && containsVisibleMesh(child));
  const explicitGroups = meshChildren.filter((child) => !(child as THREE.Mesh).isMesh);
  if (explicitGroups.length === 0) {
    return {
      composite,
      components: [rescopeTarget(composite, `${id}:component:0`, 'component')]
    };
  }

  const components = meshChildren.flatMap((child, index) => {
    const target = surfaceSnapTargetFromObject3D(child, `${id}:component:${index}`);
    return target
      ? [rescopeTarget(target, `${id}:component:${index}`, 'component')]
      : [];
  });
"""
          new = """  const componentRoots = root.children.filter((child) => (
    child.visible && containsVisibleMesh(child)
  ));
  if (componentRoots.length === 0) {
    return {
      composite,
      components: [rescopeTarget(composite, `${id}:component:0`, 'component')]
    };
  }

  const components = componentRoots.flatMap((child, index) => {
    const componentId = `${id}:component:${index}`;
    const target = surfaceSnapTargetFromObject3D(child, componentId);
    return target
      ? [rescopeTarget(target, componentId, 'component')]
      : [];
  });
"""
          if old not in source:
              raise SystemExit('Expected import component block not found')
          source_path.write_text(source.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/appleCutterComposite.test.ts')
          test = test_path.read_text(encoding='utf-8')
          old_test = """  it('behandelt direkte Mesh-Nodes als eine logische Komponente plus äußere Hülle', () => {
    const root = new THREE.Group();
    const wall = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 0.2));
    wall.position.x = -0.5;
    const roof = new THREE.Mesh(new THREE.ConeGeometry(0.8, 0.7, 4));
    roof.position.set(0.4, 0.8, 0);
    root.add(wall, roof);

    const analysis = analyzeImportedObject3DSnapTargets(root, 'imported-house');

    expect(analysis.composite?.scope).toBe('composite');
    expect(analysis.composite?.anchors.length).toBeGreaterThan(0);
    expect(analysis.components).toHaveLength(1);
    expect(analysis.components[0]?.scope).toBe('component');
    expect(analysis.components[0]?.anchors.length).toBeGreaterThan(0);

    wall.geometry.dispose();
    roof.geometry.dispose();
  });
"""
          new_test = """  it('behandelt direkte Mesh-Nodes als getrennte Komponenten plus äußere Hülle', () => {
    const root = new THREE.Group();
    const wall = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 0.2));
    wall.position.x = -0.5;
    const roof = new THREE.Mesh(new THREE.ConeGeometry(0.8, 0.7, 4));
    roof.position.set(0.4, 0.8, 0);
    root.add(wall, roof);

    const analysis = analyzeImportedObject3DSnapTargets(root, 'imported-house');

    expect(analysis.composite?.scope).toBe('composite');
    expect(analysis.composite?.anchors.length).toBeGreaterThan(0);
    expect(analysis.components).toHaveLength(2);
    expect(analysis.components.every((target) => target.scope === 'component')).toBe(true);
    expect(analysis.components.every((target) => target.anchors.length > 0)).toBe(true);
    expect(new Set(analysis.components.map((target) => target.id)).size).toBe(2);

    wall.geometry.dispose();
    roof.geometry.dispose();
  });
"""
          if old_test not in test:
              raise SystemExit('Expected direct-mesh test block not found')
          test_path.write_text(test.replace(old_test, new_test, 1), encoding='utf-8')

      - name: Remove temporary workflow
        run: rm .github/workflows/apply-import-component-grids.yml

      - name: Commit correction
        run: |
          git config user.name "NorthCore Automation"
          git config user.email "automation@northcore-eu.de"
          git add src/editor/snapping/objectSurfaceSnap.ts tests/appleCutterComposite.test.ts .github/workflows/apply-import-component-grids.yml
          git commit -m "Importe je direktem Bauteil rasterisieren"
          git push origin HEAD:feature/apple-cutter-model
