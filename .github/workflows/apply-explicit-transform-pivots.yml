name: Apply Explicit Transform Pivots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-explicit-transform-pivots.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Replace internal gizmo patches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          paint_path = Path('src/editor/paint/useSurfacePaint.ts')
          paint = paint_path.read_text(encoding='utf-8')
          paint = paint.replace(
              "import { useEffect, useMemo, useRef, type MutableRefObject } from 'react';",
              "import { useEffect } from 'react';"
          )
          paint = paint.replace(
              "import { useFrame, useThree } from '@react-three/fiber';",
              "import { useThree } from '@react-three/fiber';"
          )
          paint = paint.replace("import { useEditorStore } from '../../store/editorStore';\n", "")
          paint, count = re.subn(
              r"\ninterface PositionCopyPatch \{.*?\nconst sceneEnvironments",
              "\nconst sceneEnvironments",
              paint,
              count=1,
              flags=re.S
          )
          if count != 1:
              raise SystemExit('Patch-Interfaces wurden nicht gefunden.')
          paint, count = re.subn(
              r"\nfunction setBasicMaterialAppearance\(.*?\nfunction setSceneEnvironment",
              "\nfunction setSceneEnvironment",
              paint,
              count=1,
              flags=re.S
          )
          if count != 1:
              raise SystemExit('Material-Patchfunktion wurde nicht gefunden.')
          paint, count = re.subn(
              r"\nfunction octahedronRadius\(.*?\nfunction useNeutralMaterialEnvironment",
              "\nfunction useNeutralMaterialEnvironment",
              paint,
              count=1,
              flags=re.S
          )
          if count != 1:
              raise SystemExit('Interne Gizmo-Patches wurden nicht gefunden.')
          paint = paint.replace(
              "  useOriginalCenterScaleHandle(object, geometry, selected, settings.enabled);\n",
              ""
          )
          paint = paint.replace(
              "  useOriginalTranslateGizmoCenter(object, geometry, selected, settings.enabled);\n",
              ""
          )
          paint_path.write_text(paint, encoding='utf-8')

          viewport_path = Path('src/editor/viewport/EditorViewport.tsx')
          viewport = viewport_path.read_text(encoding='utf-8')
          viewport = viewport.replace(
              "import { useSurfacePaint, useSurfacePaintSettings } from '../paint/useSurfacePaint';",
              "import { invertHexColor, useSurfacePaint, useSurfacePaintSettings } from '../paint/useSurfacePaint';"
          )
          viewport = viewport.replace(
              "interface GroupDragState {\n  proxyMatrix: THREE.Matrix4;\n  objectMatrices: Map<string, THREE.Matrix4>;\n}\n",
              "interface SingleTranslateDragState {\n  startProxyPosition: THREE.Vector3;\n  startMeshWorldPosition: THREE.Vector3;\n}\n\ninterface GroupDragState {\n  proxyMatrix: THREE.Matrix4;\n  objectMatrices: Map<string, THREE.Matrix4>;\n}\n"
          )

          center_pattern = re.compile(
              r"function CenterScaleHandle\(\{ mesh, bounds, onPointerDown \}: \{.*?\n\}\n\nfunction CornerScaleHandle",
              re.S
          )
          center_replacement = '''function CenterScaleHandle({ mesh, bounds, color, onPointerDown }: {
            mesh: THREE.Mesh;
            bounds: THREE.Box3;
            color: string;
            onPointerDown: (event: ThreeEvent<PointerEvent>) => void;
          }) {
            const handleRef = useRef<THREE.Group>(null);

            useFrame(() => {
              const handle = handleRef.current;
              if (!handle) return;

              mesh.updateMatrixWorld(true);
              const localCenter = bounds.getCenter(new THREE.Vector3());
              handle.position.copy(mesh.localToWorld(localCenter));
              handle.quaternion.identity();
              handle.scale.setScalar(scaleHandleWorldSize(mesh, bounds) / 0.2);
            });

            return (
              <group ref={handleRef} renderOrder={Infinity}>
                <mesh renderOrder={Infinity}>
                  <octahedronGeometry args={[CENTER_SCALE_VISUAL_RADIUS, 0]} />
                  <meshBasicMaterial
                    color={color}
                    transparent
                    opacity={1}
                    depthTest={false}
                    depthWrite={false}
                    fog={false}
                    toneMapped={false}
                  />
                </mesh>
                <mesh renderOrder={Infinity} onPointerDown={onPointerDown}>
                  <octahedronGeometry args={[CENTER_SCALE_HITBOX_RADIUS, 0]} />
                  <meshBasicMaterial
                    color={color}
                    transparent
                    opacity={0}
                    depthTest={false}
                    depthWrite={false}
                    fog={false}
                    toneMapped={false}
                  />
                </mesh>
              </group>
            );
          }

          function CornerScaleHandle'''
          viewport, count = center_pattern.subn(center_replacement, viewport, count=1)
          if count != 1:
              raise SystemExit('CenterScaleHandle wurde nicht gefunden.')

          viewport = viewport.replace(
              "      <CenterScaleHandle mesh={mesh} bounds={bounds} onPointerDown={startCenterDrag} />",
              "      <CenterScaleHandle\n        mesh={mesh}\n        bounds={bounds}\n        color={invertHexColor(object.material.color)}\n        onPointerDown={startCenterDrag}\n      />"
          )

          translate_component = r'''
          function SingleTranslateControls({
            mesh,
            geometry,
            object,
            snap,
            onSnapTargetChange,
            onTransformDraggingChange
          }: {
            mesh: THREE.Mesh;
            geometry: THREE.BufferGeometry;
            object: SceneObjectData;
            snap: SnapSettings;
            onSnapTargetChange: (targetId: string | null) => void;
            onTransformDraggingChange: (dragging: boolean) => void;
          }) {
            const proxy = useMemo(() => new THREE.Object3D(), []);
            const dragRef = useRef<SingleTranslateDragState | null>(null);
            const objects = useEditorStore((state) => state.objects);
            const updateObject = useEditorStore((state) => state.updateObject);
            const beginTransaction = useEditorStore((state) => state.beginTransaction);
            const endTransaction = useEditorStore((state) => state.endTransaction);
            const localCenter = useMemo(() => {
              geometry.computeBoundingBox();
              return geometry.boundingBox?.getCenter(new THREE.Vector3()) ?? new THREE.Vector3();
            }, [geometry]);

            const resetProxy = useCallback(() => {
              mesh.updateMatrixWorld(true);
              proxy.position.copy(mesh.localToWorld(localCenter.clone()));
              proxy.rotation.set(0, 0, 0);
              proxy.scale.set(1, 1, 1);
              proxy.updateMatrixWorld(true);
            }, [localCenter, mesh, proxy]);

            useFrame(() => {
              if (!dragRef.current) resetProxy();
            });

            const start = () => {
              resetProxy();
              dragRef.current = {
                startProxyPosition: proxy.position.clone(),
                startMeshWorldPosition: mesh.getWorldPosition(new THREE.Vector3())
              };
              onSnapTargetChange(null);
              beginTransaction();
              onTransformDraggingChange(true);
            };

            const sync = () => {
              const drag = dragRef.current;
              if (!drag) return;

              const worldDelta = proxy.position.clone().sub(drag.startProxyPosition);
              const nextWorldPosition = drag.startMeshWorldPosition.clone().add(worldDelta);
              const nextLocalPosition = mesh.parent
                ? mesh.parent.worldToLocal(nextWorldPosition.clone())
                : nextWorldPosition;
              mesh.position.copy(nextLocalPosition);
              mesh.updateMatrixWorld(true);

              let position: SceneObjectData['position'] = [
                mesh.position.x,
                mesh.position.y,
                mesh.position.z
              ];
              const rotation: SceneObjectData['rotation'] = [
                mesh.rotation.x,
                mesh.rotation.y,
                mesh.rotation.z
              ];
              const scale: SceneObjectData['scale'] = [
                mesh.scale.x,
                mesh.scale.y,
                mesh.scale.z
              ];

              if (snap.surface && isFormType(object.type)) {
                const result = findFormSurfaceSnap(
                  { ...object, position, rotation, scale },
                  objects,
                  snap.position
                );
                position = result.position;
                mesh.position.set(position[0], position[1], position[2]);
                mesh.updateMatrixWorld(true);
                onSnapTargetChange(result.targetId);
              } else {
                onSnapTargetChange(null);
              }

              updateObject(object.id, { position, rotation, scale }, false);
            };

            const stop = () => {
              sync();
              dragRef.current = null;
              onSnapTargetChange(null);
              endTransaction();
              onTransformDraggingChange(false);
              resetProxy();
            };

            useEffect(() => () => {
              if (!dragRef.current) return;
              dragRef.current = null;
              onSnapTargetChange(null);
              endTransaction();
              onTransformDraggingChange(false);
            }, [endTransaction, onSnapTargetChange, onTransformDraggingChange]);

            return (
              <>
                <primitive object={proxy} />
                <TransformControls
                  object={proxy}
                  mode="translate"
                  space="world"
                  size={1.15}
                  translationSnap={snap.enabled ? snap.position : undefined}
                  onMouseDown={start}
                  onObjectChange={sync}
                  onMouseUp={stop}
                />
              </>
            );
          }

          '''
          marker = "function GroupTransformControls("
          if marker not in viewport:
              raise SystemExit('Einfügepunkt für SingleTranslateControls fehlt.')
          viewport = viewport.replace(marker, translate_component + marker, 1)

          viewport = viewport.replace(
              "  const objects = useEditorStore((state) => state.objects);\n  const selectedIds = useEditorStore((state) => state.selectedIds);",
              "  const selectedIds = useEditorStore((state) => state.selectedIds);",
              1
          )

          transform_pattern = re.compile(
              r"\n  const syncTransform = \(\) => \{.*?\n  const stopTransform = \(\) => \{.*?\n  \};\n",
              re.S
          )
          transform_replacement = '''
            const syncRotation = () => {
              if (!mesh) return;
              updateObject(object.id, {
                position: [mesh.position.x, mesh.position.y, mesh.position.z],
                rotation: [mesh.rotation.x, mesh.rotation.y, mesh.rotation.z],
                scale: [mesh.scale.x, mesh.scale.y, mesh.scale.z]
              }, false);
            };

            const startRotation = () => {
              onSnapTargetChange(null);
              beginTransaction();
              onTransformDraggingChange(true);
            };

            const stopRotation = () => {
              syncRotation();
              endTransaction();
              onTransformDraggingChange(false);
            };
          '''
          viewport, count = transform_pattern.subn(transform_replacement, viewport, count=1)
          if count != 1:
              raise SystemExit('Direkter Transformationsblock wurde nicht gefunden.')

          old_controls = '''      {!paintSettings.enabled && singleSelection && !object.locked && object.visible && mesh && (
                tool === 'scale' ? (
                  <ScaleHandles
                    mesh={mesh}
                    geometry={geometry}
                    object={object}
                    snap={snap}
                    onSnapTargetChange={onSnapTargetChange}
                    onTransformDraggingChange={onTransformDraggingChange}
                  />
                ) : (
                  <TransformControls
                    object={mesh}
                    mode={tool}
                    space="world"
                    size={tool === 'rotate' ? 1.4 : 1.15}
                    translationSnap={snap.enabled ? snap.position : undefined}
                    rotationSnap={snap.enabled ? THREE.MathUtils.degToRad(snap.rotation) : undefined}
                    onMouseDown={startTransform}
                    onObjectChange={syncTransform}
                    onMouseUp={stopTransform}
                  />
                )
              )}'''
          new_controls = '''      {!paintSettings.enabled && singleSelection && !object.locked && object.visible && mesh && (
                tool === 'scale' ? (
                  <ScaleHandles
                    mesh={mesh}
                    geometry={geometry}
                    object={object}
                    snap={snap}
                    onSnapTargetChange={onSnapTargetChange}
                    onTransformDraggingChange={onTransformDraggingChange}
                  />
                ) : tool === 'translate' ? (
                  <SingleTranslateControls
                    mesh={mesh}
                    geometry={geometry}
                    object={object}
                    snap={snap}
                    onSnapTargetChange={onSnapTargetChange}
                    onTransformDraggingChange={onTransformDraggingChange}
                  />
                ) : (
                  <TransformControls
                    object={mesh}
                    mode="rotate"
                    space="world"
                    size={1.4}
                    rotationSnap={snap.enabled ? THREE.MathUtils.degToRad(snap.rotation) : undefined}
                    onMouseDown={startRotation}
                    onObjectChange={syncRotation}
                    onMouseUp={stopRotation}
                  />
                )
              )}'''
          if old_controls not in viewport:
              raise SystemExit('TransformControls-Ausgabeblock wurde nicht gefunden.')
          viewport = viewport.replace(old_controls, new_controls, 1)

          viewport_path.write_text(viewport, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build web app
        run: npm run build

      - name: Commit verified pivot cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-explicit-transform-pivots.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editor/paint/useSurfacePaint.ts src/editor/viewport/EditorViewport.tsx .github/workflows/apply-explicit-transform-pivots.yml
          git commit -m "Transformations-Pivots explizit verwalten"
          git push origin HEAD:main
