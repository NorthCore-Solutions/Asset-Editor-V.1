name: Android Pinch Zoom Check

on:
  push:
    branches:
      - fix/android-pinch-zoom

permissions:
  contents: write

jobs:
  patch-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/android-pinch-zoom

      - name: Patch Android pinch controls into viewport
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/editor/viewport/EditorViewport.tsx')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "import { PrimitiveSnapPattern } from './PrimitiveSnapPattern';",
                  "import { isNativeAndroid } from '../../platform/nativeFileDialog';\nimport { AndroidTouchZoomControls } from './AndroidTouchZoomControls';\nimport { PrimitiveSnapPattern } from './PrimitiveSnapPattern';"
              ),
              (
                  "  const [transformDragging, setTransformDragging] = useState(false);\n  const [snapTargetId, setSnapTargetId] = useState<string | null>(null);",
                  "  const [transformDragging, setTransformDragging] = useState(false);\n  const [snapTargetId, setSnapTargetId] = useState<string | null>(null);\n  const nativeAndroid = isNativeAndroid();"
              ),
              (
                  "        enableZoom\n        zoomToCursor",
                  "        enableZoom={!nativeAndroid}\n        zoomToCursor"
              ),
              (
                  "      />\n      <KeyboardCameraControls active={!paintSettings.enabled && keyboardActive && !transformDragging && !selectionActive} />",
                  "      />\n      <AndroidTouchZoomControls active={nativeAndroid && !transformDragging && !selectionActive} />\n      <KeyboardCameraControls active={!paintSettings.enabled && keyboardActive && !transformDragging && !selectionActive} />"
              )
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:80]}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint
      - run: npx cap sync android

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: asset-editor-android-pinch-zoom
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit tested implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editor/viewport/EditorViewport.tsx
          git commit -m "Android-Pinch-Zoom vom Orbit-Ziel entkoppeln"
          git push origin HEAD:fix/android-pinch-zoom
