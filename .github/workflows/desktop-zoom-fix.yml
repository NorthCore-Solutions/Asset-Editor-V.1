name: Desktop Zoom Fix

on:
  push:
    branches:
      - fix/desktop-zoom-target

permissions:
  contents: write

jobs:
  patch-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/desktop-zoom-target

      - name: Patch cursor-focused zoom
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/editor/viewport/EditorViewport.tsx')
          text = path.read_text(encoding='utf-8')
          old = "        enableZoom\n        enableDamping"
          new = "        enableZoom\n        zoomToCursor\n        enableDamping"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one OrbitControls zoom block, found {count}.')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Install dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint

      - name: Commit tested desktop fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editor/viewport/EditorViewport.tsx
          git commit -m "Desktop-Zoom auf Mausposition ausrichten"
          git push origin HEAD:fix/desktop-zoom-target
