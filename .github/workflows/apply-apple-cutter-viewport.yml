name: Apply Apple Cutter Viewport Patch

on:
  push:
    branches:
      - feature/apple-cutter-model

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[apple-cutter-viewport]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/apple-cutter-model
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Viewport patchen
        run: node scripts/applyAppleCutterViewport.mjs

      - name: Änderung committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editor/viewport/EditorViewport.tsx
          git diff --cached --quiet && exit 0
          git commit -m "[apple-cutter-viewport] Gemeinsamen Maus- und Touch-Drag anbinden"
          git push origin HEAD:feature/apple-cutter-model
