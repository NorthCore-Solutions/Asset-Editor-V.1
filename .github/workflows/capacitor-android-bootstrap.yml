name: Capacitor Android Bootstrap

on:
  push:
    branches:
      - feature/capacitor-android-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capacitor-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install existing dependencies
        run: npm ci

      - name: Bootstrap Capacitor Android
        if: github.event_name == 'push'
        shell: bash
        run: |
          npm install --save-exact @capacitor/core@8.4.2 @capacitor/android@8.4.2
          npm install --save-dev --save-exact @capacitor/cli@8.4.2

          npm pkg set 'scripts.mobile:sync=npm run build && cap sync android'
          npm pkg set 'scripts.mobile:open=cap open android'
          npm pkg set 'scripts.android:debug=npm run mobile:sync && cd android && ./gradlew assembleDebug'

          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'de.northcore.asseteditor',
            appName: 'NorthCore Asset Editor',
            webDir: 'dist'
          };

          export default config;
          EOF

          npm run build

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

          cat >> .gitignore <<'EOF'

          # Android / Capacitor
          android/.gradle/
          android/.idea/
          android/local.properties
          android/**/build/
          *.apk
          *.aab
          EOF

      - name: Commit generated Android project
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            exit 0
          fi

          git config user.name "NorthCore CI"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json capacitor.config.ts android .gitignore
          git commit -m "Capacitor-Android-Grundgerüst hinzufügen"
          git push origin HEAD:feature/capacitor-android-foundation

      - name: Build web app
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Sync Android assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: northcore-asset-editor-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
