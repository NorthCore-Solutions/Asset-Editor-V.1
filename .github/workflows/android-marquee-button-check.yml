name: Android Marquee Button Check

on:
  push:
    branches:
      - feature/android-marquee-button

permissions:
  contents: write

jobs:
  patch-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/android-marquee-button

      - name: Connect Android marquee button
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/editor/viewport/EditorViewport.tsx')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "import { AndroidTouchZoomControls } from './AndroidTouchZoomControls';\nimport { PrimitiveSnapPattern } from './PrimitiveSnapPattern';",
                  "import { AndroidTouchZoomControls } from './AndroidTouchZoomControls';\nimport { AndroidMarqueeButton } from './AndroidMarqueeButton';\nimport { isAndroidMarqueePointer } from './androidMarqueeSelection';\nimport { PrimitiveSnapPattern } from './PrimitiveSnapPattern';"
              ),
              (
                  "  const marqueeRef = useRef<MarqueeState | null>(null);\n  const suppressNextClickRef = useRef(false);\n  const [keyboardActive, setKeyboardActive] = useState(false);\n  const [marquee, setMarquee] = useState<MarqueeState | null>(null);",
                  "  const marqueeRef = useRef<MarqueeState | null>(null);\n  const marqueeFromAndroidButtonRef = useRef(false);\n  const suppressNextClickRef = useRef(false);\n  const nativeAndroid = isNativeAndroid();\n  const [keyboardActive, setKeyboardActive] = useState(false);\n  const [marquee, setMarquee] = useState<MarqueeState | null>(null);\n  const [androidMarqueeArmed, setAndroidMarqueeArmed] = useState(false);"
              ),
              (
                  "    removeMarqueeListeners();\n    marqueeRef.current = null;\n    setMarquee(null);\n\n    const width = Math.abs(current.currentX - current.startX);",
                  "    const startedFromAndroidButton = marqueeFromAndroidButtonRef.current;\n    removeMarqueeListeners();\n    marqueeRef.current = null;\n    marqueeFromAndroidButtonRef.current = false;\n    setMarquee(null);\n    if (startedFromAndroidButton) setAndroidMarqueeArmed(false);\n\n    const width = Math.abs(current.currentX - current.startX);"
              ),
              (
                  "  useEffect(() => () => removeMarqueeListeners(), [removeMarqueeListeners]);\n\n  const startMarquee = (event: React.PointerEvent<HTMLDivElement>) => {\n    viewportRef.current?.focus();\n    if (paintSettings.enabled || event.button !== 0 || !event.ctrlKey || !viewportRef.current) return;",
                  "  useEffect(() => () => removeMarqueeListeners(), [removeMarqueeListeners]);\n\n  useEffect(() => {\n    if (!paintSettings.enabled || !androidMarqueeArmed) return;\n    // Der Android-Auswahlmodus darf im Malmodus nicht aktiv bleiben.\n    // eslint-disable-next-line react-hooks/set-state-in-effect\n    setAndroidMarqueeArmed(false);\n  }, [androidMarqueeArmed, paintSettings.enabled]);\n\n  const startMarquee = (event: React.PointerEvent<HTMLDivElement>) => {\n    const target = event.target;\n    if (target instanceof Element && target.closest('[data-android-marquee-button=\"true\"]')) return;\n    viewportRef.current?.focus();\n    const androidMarquee = isAndroidMarqueePointer(nativeAndroid, androidMarqueeArmed, event.pointerType);\n    if (\n      paintSettings.enabled\n      || event.button !== 0\n      || (!event.ctrlKey && !androidMarquee)\n      || !viewportRef.current\n      || marqueeRef.current\n    ) return;"
              ),
              (
                  "    marqueeRef.current = state;\n    suppressNextClickRef.current = false;",
                  "    marqueeRef.current = state;\n    marqueeFromAndroidButtonRef.current = androidMarquee;\n    suppressNextClickRef.current = false;"
              ),
              (
                  "          selectionActive={Boolean(marquee)}",
                  "          selectionActive={Boolean(marquee) || androidMarqueeArmed}"
              ),
              (
                  "      </Canvas>\n      {marquee && <div className=\"selection-marquee\" style={marqueeStyle} />}",
                  "      </Canvas>\n      {nativeAndroid && (\n        <AndroidMarqueeButton\n          active={androidMarqueeArmed}\n          disabled={paintSettings.enabled}\n          onToggle={() => {\n            viewportRef.current?.focus();\n            setAndroidMarqueeArmed((current) => !current);\n          }}\n        />\n      )}\n      {marquee && <div className=\"selection-marquee\" style={marqueeStyle} />}"
              )
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:120]}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint
      - run: npx cap sync android

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Commit tested viewport integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editor/viewport/EditorViewport.tsx
          git commit -m "Android-Bereichsauswahl in Viewport einbinden"
          git push origin HEAD:feature/android-marquee-button
