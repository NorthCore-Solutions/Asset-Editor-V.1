name: Apply Composite Anchor Filter

on:
  push:
    branches:
      - feature/apple-cutter-model

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/apple-cutter-model
          fetch-depth: 0
      - name: Connect coincident anchor filter
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/editor/snapping/objectSurfaceSnap.ts')
          source = path.read_text(encoding='utf-8')
          import_marker = "import type { AppleCutterScope } from '../appleCutter/appleCutterTypes';\n"
          import_line = "import { removeOpposingCoincidentAnchors } from './compositeAnchorFilter';\n"
          if import_line not in source:
              if import_marker not in source:
                  raise SystemExit('Importposition nicht gefunden')
              source = source.replace(import_marker, import_marker + import_line, 1)

          start_marker = "  const closedParts = componentParts.filter(closedTriangleSoup);\n  if (closedParts.length < 2) return anchors;\n\n"
          replacement = start_marker + "  const exteriorCandidates = removeOpposingCoincidentAnchors(anchors);\n\n"
          if 'const exteriorCandidates = removeOpposingCoincidentAnchors(anchors);' not in source:
              if start_marker not in source:
                  raise SystemExit('Composite-Filterposition nicht gefunden')
              source = source.replace(start_marker, replacement, 1)

          old_return = "    return anchors.filter((anchor) => {\n"
          new_return = "    return exteriorCandidates.filter((anchor) => {\n"
          if old_return not in source:
              raise SystemExit('Filter-Rückgabe nicht gefunden')
          source = source.replace(old_return, new_return, 1)
          path.write_text(source, encoding='utf-8')
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git rm .github/workflows/apply-composite-anchor-filter.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editor/snapping/objectSurfaceSnap.ts
          git commit -m "Innere Composite-Kontaktpunkte entfernen"
          git push origin HEAD:feature/apple-cutter-model
