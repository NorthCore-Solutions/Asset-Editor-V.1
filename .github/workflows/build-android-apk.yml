name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.*'
      - '.github/workflows/build-android-apk.yml'
      - '.github/apk-build-trigger'
      - '.github/android-marquee-fix-trigger'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Apply structural Android marquee toggle fix
        if: github.event_name == 'pull_request' && github.head_ref == 'build/android-apk-2026-08-05'
        shell: python
        run: |
          from pathlib import Path

          button_path = Path('src/editor/viewport/AndroidMarqueeButton.tsx')
          button_path.write_text("""import './android-marquee-button.css';

          interface AndroidMarqueeButtonProps {
            active: boolean;
            disabled: boolean;
            onToggle: () => void;
          }

          export function AndroidMarqueeButton({ active, disabled, onToggle }: AndroidMarqueeButtonProps) {
            return (
              <button
                type=\"button\"
                data-android-marquee-button=\"true\"
                className={`android-marquee-button${active ? ' active' : ''}`}
                aria-label=\"Bereich auswählen\"
                aria-pressed={active}
                disabled={disabled}
                onClick={onToggle}
              >
                <svg aria-hidden=\"true\" viewBox=\"0 0 24 24\">
                  <rect x=\"3.5\" y=\"4.5\" width=\"17\" height=\"13\" rx=\"1.5\" />
                  <path d=\"M8 20.5h8\" />
                </svg>
                <span>Bereich</span>
              </button>
            );
          }
          """.replace('          ', ''), encoding='utf-8')

          viewport_path = Path('src/editor/viewport/EditorViewport.tsx')
          source = viewport_path.read_text(encoding='utf-8')

          replacements = [
            ("  const marqueeFromAndroidButtonRef = useRef(false);\n", ""),
            ("    const startedFromAndroidButton = marqueeFromAndroidButtonRef.current;\n", ""),
            ("    marqueeFromAndroidButtonRef.current = false;\n", ""),
            ("    if (startedFromAndroidButton) setAndroidMarqueeArmed(false);\n", ""),
            ("    marqueeFromAndroidButtonRef.current = androidMarquee;\n", ""),
            (
              "    suppressNextClickRef.current = true;\n    if (width < 4 || height < 4) return;\n",
              "    suppressNextClickRef.current = true;\n    window.setTimeout(() => {\n      suppressNextClickRef.current = false;\n    }, 0);\n    if (width < 4 || height < 4) return;\n"
            ),
            (
              "      onClickCapture={(event) => {\n        if (!suppressNextClickRef.current) return;\n        suppressNextClickRef.current = false;\n",
              "      onClickCapture={(event) => {\n        if (!suppressNextClickRef.current) return;\n        const target = event.target;\n        if (target instanceof Element && target.closest('[data-android-marquee-button=\\\"true\\\"]')) {\n          suppressNextClickRef.current = false;\n          return;\n        }\n        suppressNextClickRef.current = false;\n"
            ),
          ]

          for old, new in replacements:
            if old not in source:
              raise RuntimeError(f'Expected source block not found: {old!r}')
            source = source.replace(old, new, 1)

          viewport_path.write_text(source, encoding='utf-8')

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Run lint
        run: npm run lint

      - name: Verify toggle architecture
        if: github.event_name == 'pull_request' && github.head_ref == 'build/android-apk-2026-08-05'
        shell: bash
        run: |
          ! grep -q "queueMicrotask(onToggle)" src/editor/viewport/AndroidMarqueeButton.tsx
          ! grep -q "marqueeFromAndroidButtonRef" src/editor/viewport/EditorViewport.tsx
          grep -q "onClick={onToggle}" src/editor/viewport/AndroidMarqueeButton.tsx

      - name: Commit toggle fix to main
        if: github.event_name == 'pull_request' && github.head_ref == 'build/android-apk-2026-08-05'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editor/viewport/AndroidMarqueeButton.tsx src/editor/viewport/EditorViewport.tsx
          git commit -m "Android-Bereichsbutton strukturell korrigieren"
          git push origin HEAD:main

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Store current APK in repository
        if: github.event_name == 'pull_request' && github.head_ref == 'build/android-apk-2026-08-05'
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/NorthCore-Asset-Editor-latest.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk/NorthCore-Asset-Editor-latest.apk
          git commit -m "Aktuelle Android-APK bereitstellen"
          git push origin HEAD:main

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: asset-editor-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
