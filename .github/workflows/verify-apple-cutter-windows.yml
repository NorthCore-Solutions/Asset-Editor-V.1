name: Verify Apple Cutter Windows

on:
  push:
    branches:
      - feature/apple-cutter-model
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: .\gradlew.bat assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: asset-editor-apple-cutter-windows-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Record verified head
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 32 --repo NorthCore-Solutions/Asset-Editor-V.1 --body "APPLE_CUTTER_CI_OK `${{ github.sha }}`: Lint, Tests, Web-Build, Android-Sync und Debug-APK erfolgreich."
