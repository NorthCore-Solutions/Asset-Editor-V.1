name: Fix Scale Handle Visibility

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scale-handle-visibility-trigger'

permissions:
  contents: write

jobs:
  fix-scale-handles:
    if: github.head_ref == 'build/scale-handle-visibility-2026-08-05'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Increase scale handles and restore negative center color
        shell: python
        run: |
          from pathlib import Path

          viewport_path = Path('src/editor/viewport/EditorViewport.tsx')
          viewport = viewport_path.read_text(encoding='utf-8')

          replacements = [
            (
              """const CENTER_SCALE_VISUAL_RADIUS = 0.11;
const CENTER_SCALE_HITBOX_RADIUS = 0.28;
const CORNER_SCALE_VISUAL_SIZE = 1.16;
const CORNER_SCALE_HITBOX_SIZE = 1.55;
""",
              """const CENTER_SCALE_VISUAL_RADIUS = 0.15;
const CENTER_SCALE_HITBOX_RADIUS = 0.4;
const CORNER_SCALE_VISUAL_SIZE = 1.55;
const CORNER_SCALE_HITBOX_SIZE = 2.2;
"""
            ),
            (
              """    <group ref={handleRef} renderOrder={Infinity}>
      <mesh renderOrder={Infinity}>
""",
              """    <group ref={handleRef} name=\"scale-center-handle\" renderOrder={Infinity}>
      <mesh name=\"scale-center-visual\" renderOrder={Infinity}>
"""
            ),
            (
              """      <mesh renderOrder={Infinity} onPointerDown={onPointerDown}>
""",
              """      <mesh name=\"scale-center-hitbox\" renderOrder={Infinity} onPointerDown={onPointerDown}>
"""
            ),
          ]

          for old, new in replacements:
            if viewport.count(old) != 1:
              raise RuntimeError(f'Viewport block expected once, found {viewport.count(old)}: {old!r}')
            viewport = viewport.replace(old, new, 1)

          viewport_path.write_text(viewport, encoding='utf-8')

          paint_path = Path('src/editor/paint/useSurfacePaint.ts')
          paint = paint_path.read_text(encoding='utf-8')

          old_finder = """function findOriginalCenterScaleHandle(scene: THREE.Scene): {
  group: THREE.Object3D;
  material: THREE.MeshBasicMaterial;
} | null {
  let result: { group: THREE.Object3D; material: THREE.MeshBasicMaterial } | null = null;

  scene.traverse((candidate) => {
    if (result || !(candidate instanceof THREE.Group) || candidate.children.length !== 2) return;
    if (candidate.renderOrder !== Number.POSITIVE_INFINITY) return;

    const meshes = candidate.children.filter((child): child is THREE.Mesh => child instanceof THREE.Mesh);
    if (meshes.length !== 2) return;

    const visual = meshes.find((mesh) => {
      const material = mesh.material;
      const radius = octahedronRadius(mesh);
      return material instanceof THREE.MeshBasicMaterial
        && material.opacity > 0.001
        && radius !== null
        && Math.abs(radius - 0.1) < 0.0001;
    });
    const hitArea = meshes.find((mesh) => {
      const material = mesh.material;
      const radius = octahedronRadius(mesh);
      return material instanceof THREE.MeshBasicMaterial
        && material.opacity <= 0.001
        && radius !== null
        && Math.abs(radius - 0.2) < 0.0001;
    });

    const visualMaterial: unknown = visual?.material;
    if (!visual || !hitArea || !(visualMaterial instanceof THREE.MeshBasicMaterial)) return;
    result = { group: candidate, material: visualMaterial };
  });

  return result;
}
"""

          new_finder = """function findOriginalCenterScaleHandle(scene: THREE.Scene): {
  group: THREE.Object3D;
  material: THREE.MeshBasicMaterial;
} | null {
  const group = scene.getObjectByName('scale-center-handle');
  const visual = scene.getObjectByName('scale-center-visual');
  const hitArea = scene.getObjectByName('scale-center-hitbox');

  if (!(group instanceof THREE.Group) || !(visual instanceof THREE.Mesh) || !(hitArea instanceof THREE.Mesh)) {
    return null;
  }

  const visualMaterial: unknown = visual.material;
  const hitMaterial: unknown = hitArea.material;
  if (!(visualMaterial instanceof THREE.MeshBasicMaterial)
    || !(hitMaterial instanceof THREE.MeshBasicMaterial)
    || hitMaterial.opacity > 0.001) {
    return null;
  }

  return { group, material: visualMaterial };
}
"""

          if paint.count(old_finder) != 1:
            raise RuntimeError(f'Center handle finder expected once, found {paint.count(old_finder)}')
          paint = paint.replace(old_finder, new_finder, 1)
          paint_path.write_text(paint, encoding='utf-8')

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run build
        run: npm run build

      - name: Run lint
        run: npm run lint

      - name: Verify limited changes
        shell: bash
        run: |
          grep -q "CENTER_SCALE_VISUAL_RADIUS = 0.15" src/editor/viewport/EditorViewport.tsx
          grep -q "CENTER_SCALE_HITBOX_RADIUS = 0.4" src/editor/viewport/EditorViewport.tsx
          grep -q "CORNER_SCALE_VISUAL_SIZE = 1.55" src/editor/viewport/EditorViewport.tsx
          grep -q "CORNER_SCALE_HITBOX_SIZE = 2.2" src/editor/viewport/EditorViewport.tsx
          grep -q "scale-center-visual" src/editor/paint/useSurfacePaint.ts
          grep -q "pixelsPerFactor: 140" src/editor/viewport/EditorViewport.tsx
          grep -q "size={tool === 'rotate' ? 1.4 : 1.15}" src/editor/viewport/EditorViewport.tsx
          git diff --check

      - name: Commit correction to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editor/viewport/EditorViewport.tsx src/editor/paint/useSurfacePaint.ts
          git commit -m "Skalierpunkte vergrößern und Negativfarbe wiederherstellen"
          git push origin HEAD:main
