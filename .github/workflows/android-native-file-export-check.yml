name: Android Native File Export Check

on:
  push:
    branches:
      - fix/android-native-file-export

permissions:
  contents: read

concurrency:
  group: android-native-file-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: asset-editor-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
