name: Base Paint Fix Check

on:
  push:
    branches:
      - fix/base-paint-separation
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: base-paint-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply fix
        if: github.event_name == 'push'
        run: node scripts/apply-base-paint-fix.mjs

      - name: Commit fix
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "NorthCore CI"
          git config user.email "actions@users.noreply.github.com"
          git add src tests
          git commit -m "Grundfarbe und Bemalung sauber trennen"
          git push origin HEAD:fix/base-paint-separation

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint
