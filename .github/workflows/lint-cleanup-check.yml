name: Lint Cleanup Check

on:
  push:
    branches:
      - lint-cleanup-2026-08-04
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: lint-cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply final lint fix
        if: github.event_name == 'push'
        run: node scripts/fix-final-lint.mjs

      - name: Commit final lint fix
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "NorthCore CI"
          git config user.email "actions@users.noreply.github.com"
          git add src
          git commit -m "Letzten Lint-Fehler beseitigen"
          git push origin HEAD:lint-cleanup-2026-08-04

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint
