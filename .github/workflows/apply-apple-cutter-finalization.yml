name: Apply Apple Cutter Finalization

on:
  push:
    branches:
      - feature/apple-cutter-model
    paths:
      - .github/workflows/apply-apple-cutter-finalization.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/apple-cutter-model

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Apply final Apple Cutter migration
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              source = file_path.read_text(encoding='utf-8')
              if old not in source:
                  raise SystemExit(f'Expected block not found in {path}: {old[:120]!r}')
              file_path.write_text(source.replace(old, new, 1), encoding='utf-8')

          Path('src/editor/appleCutter/appleCutterSnap.ts').write_text(r'''import type { SceneObjectData, Vec3 } from '../../types/editor';
          import {
            findObjectSurfaceSnap,
            type ObjectSurfaceSnapResult,
            type SurfaceSnapTarget
          } from '../snapping/objectSurfaceSnap';
          import { findSweptObjectSurfaceSnap } from '../snapping/sweptObjectSurfaceSnap';

          const EPSILON = 0.000001;

          function sameVector(left: Vec3, right: Vec3): boolean {
            return left.every((value, index) => (
              Math.abs(value - (right[index] ?? value)) <= EPSILON
            ));
          }

          function sameRotationAndScale(
            source: SceneObjectData,
            previous: SceneObjectData
          ): boolean {
            return sameVector(source.rotation, previous.rotation)
              && sameVector(source.scale, previous.scale);
          }

          function unchangedResult(source: SceneObjectData): ObjectSurfaceSnapResult {
            return {
              position: [...source.position] as Vec3,
              targetId: null,
              distance: Number.POSITIVE_INFINITY,
              sourceAnchorId: null,
              targetAnchorId: null
            };
          }

          /**
           * Zustandsloser Apfelschneider-Solver für Skalierung und direkte
           * Geometrieprüfungen. Pointer-Drags verwenden den gemeinsamen
           * Translation-Controller mit eigener Hysterese.
           */
          export function findAppleCutterSurfaceSnap(
            source: SceneObjectData,
            objects: readonly SceneObjectData[],
            positionStep: number,
            additionalTargets: readonly SurfaceSnapTarget[] = []
          ): ObjectSurfaceSnapResult {
            const previous = objects.find((object) => object.id === source.id);

            if (previous && sameRotationAndScale(source, previous)) {
              if (sameVector(source.position, previous.position)) return unchangedResult(source);
              return findSweptObjectSurfaceSnap(
                source,
                objects,
                positionStep,
                additionalTargets
              ) ?? unchangedResult(source);
            }

            return findObjectSurfaceSnap(
              source,
              objects.filter((object) => object.id !== source.id),
              positionStep,
              additionalTargets
            );
          }

          export function snapAppleCutterSurfaces(
            source: SceneObjectData,
            objects: readonly SceneObjectData[],
            positionStep: number,
            additionalTargets: readonly SurfaceSnapTarget[] = []
          ): Vec3 {
            return findAppleCutterSurfaceSnap(
              source,
              objects,
              positionStep,
              additionalTargets
            ).position;
          }
          '''.replace('\n          ', '\n').lstrip(), encoding='utf-8')

          Path('src/editor/snapping/importComponentAnalysis.ts').write_text(r'''import * as THREE from 'three';

          const POSITION_PRECISION = 0.00001;
          const MIN_CLUSTER_PADDING = 0.0001;
          const PLACEHOLDER_MATERIAL = new THREE.MeshBasicMaterial();

          interface CachedComponentRoots {
            signature: string;
            roots: THREE.Object3D[];
          }

          interface ComponentDefinition {
            order: number;
            parts: THREE.BufferGeometry[];
          }

          interface DirectPart {
            order: number;
            sourceMesh: THREE.Mesh<THREE.BufferGeometry>;
            geometry: THREE.BufferGeometry;
            bounds: THREE.Box3;
          }

          const componentRootCache = new WeakMap<THREE.Object3D, CachedComponentRoots>();

          function pointKey(position: THREE.Vector3): string {
            return [position.x, position.y, position.z]
              .map((value) => Math.round(value / POSITION_PRECISION))
              .join(':');
          }

          function splitGeometryIslands(source: THREE.BufferGeometry): THREE.BufferGeometry[] {
            const clone = source.clone();
            const geometry = clone.index ? clone.toNonIndexed() : clone;
            if (geometry !== clone) clone.dispose();

            const positions = geometry.getAttribute('position');
            const triangleCount = positions?.itemSize >= 3
              ? Math.floor(positions.count / 3)
              : 0;
            if (!positions || triangleCount === 0) {
              geometry.dispose();
              return [];
            }

            const parents = Array.from({ length: triangleCount }, (_, index) => index);
            const find = (value: number): number => {
              const current = parents[value];
              if (current === undefined || current === value) return value;
              const root = find(current);
              parents[value] = root;
              return root;
            };
            const union = (left: number, right: number): void => {
              const leftRoot = find(left);
              const rightRoot = find(right);
              if (leftRoot !== rightRoot) parents[rightRoot] = leftRoot;
            };

            const firstTriangleByPoint = new Map<string, number>();
            const point = new THREE.Vector3();
            for (let triangle = 0; triangle < triangleCount; triangle += 1) {
              for (let vertex = 0; vertex < 3; vertex += 1) {
                point.fromBufferAttribute(positions, triangle * 3 + vertex);
                const key = pointKey(point);
                const first = firstTriangleByPoint.get(key);
                if (first === undefined) firstTriangleByPoint.set(key, triangle);
                else union(triangle, first);
              }
            }

            const positionGroups = new Map<number, number[]>();
            for (let triangle = 0; triangle < triangleCount; triangle += 1) {
              const group = find(triangle);
              const values = positionGroups.get(group) ?? [];
              for (let vertex = 0; vertex < 3; vertex += 1) {
                const index = triangle * 3 + vertex;
                values.push(
                  positions.getX(index),
                  positions.getY(index),
                  positions.getZ(index)
                );
              }
              positionGroups.set(group, values);
            }

            geometry.dispose();
            return [...positionGroups.values()].map((values) => {
              const island = new THREE.BufferGeometry();
              island.setAttribute('position', new THREE.Float32BufferAttribute(values, 3));
              island.computeVertexNormals();
              island.computeBoundingBox();
              island.computeBoundingSphere();
              return island;
            });
          }

          function containsVisibleMesh(root: THREE.Object3D): boolean {
            let found = false;
            root.traverseVisible((child) => {
              if ((child as THREE.Mesh).isMesh) found = true;
            });
            return found;
          }

          function geometryPartsForNode(
            node: THREE.Object3D,
            inverseImportRoot: THREE.Matrix4
          ): Array<{
            sourceMesh: THREE.Mesh<THREE.BufferGeometry>;
            geometry: THREE.BufferGeometry;
          }> {
            const parts: Array<{
              sourceMesh: THREE.Mesh<THREE.BufferGeometry>;
              geometry: THREE.BufferGeometry;
            }> = [];

            node.traverseVisible((child) => {
              const mesh = child as THREE.Mesh<THREE.BufferGeometry>;
              if (!mesh.isMesh || !mesh.geometry) return;
              const meshToImportRoot = inverseImportRoot.clone().multiply(mesh.matrixWorld);
              for (const geometry of splitGeometryIslands(mesh.geometry)) {
                geometry.applyMatrix4(meshToImportRoot);
                geometry.computeVertexNormals();
                geometry.computeBoundingBox();
                geometry.computeBoundingSphere();
                parts.push({ sourceMesh: mesh, geometry });
              }
            });
            return parts;
          }

          function boundsForParts(parts: readonly THREE.BufferGeometry[]): THREE.Box3 {
            const bounds = new THREE.Box3().makeEmpty();
            for (const geometry of parts) {
              geometry.computeBoundingBox();
              if (geometry.boundingBox) bounds.union(geometry.boundingBox);
            }
            return bounds;
          }

          function clusterDirectParts(parts: DirectPart[]): ComponentDefinition[] {
            if (parts.length === 0) return [];
            const combinedBounds = parts.reduce(
              (bounds, part) => bounds.union(part.bounds),
              new THREE.Box3().makeEmpty()
            );
            const diagonal = combinedBounds.getSize(new THREE.Vector3()).length();
            const padding = Math.max(MIN_CLUSTER_PADDING, diagonal * 0.00001);
            const parents = parts.map((_, index) => index);
            const find = (value: number): number => {
              const current = parents[value];
              if (current === undefined || current === value) return value;
              const root = find(current);
              parents[value] = root;
              return root;
            };
            const union = (left: number, right: number): void => {
              const leftRoot = find(left);
              const rightRoot = find(right);
              if (leftRoot !== rightRoot) parents[rightRoot] = leftRoot;
            };

            for (let left = 0; left < parts.length; left += 1) {
              const leftPart = parts[left];
              if (!leftPart) continue;
              for (let right = left + 1; right < parts.length; right += 1) {
                const rightPart = parts[right];
                if (!rightPart || leftPart.sourceMesh === rightPart.sourceMesh) continue;
                const leftBounds = leftPart.bounds.clone().expandByScalar(padding);
                const rightBounds = rightPart.bounds.clone().expandByScalar(padding);
                if (leftBounds.intersectsBox(rightBounds)) union(left, right);
              }
            }

            const groups = new Map<number, DirectPart[]>();
            for (let index = 0; index < parts.length; index += 1) {
              const part = parts[index];
              if (!part) continue;
              const root = find(index);
              const group = groups.get(root) ?? [];
              group.push(part);
              groups.set(root, group);
            }

            return [...groups.values()].map((group) => ({
              order: Math.min(...group.map((part) => part.order)),
              parts: group.map((part) => part.geometry)
            }));
          }

          function syncRootTransform(
            componentRoot: THREE.Object3D,
            importMatrixWorld: THREE.Matrix4
          ): void {
            importMatrixWorld.decompose(
              componentRoot.position,
              componentRoot.quaternion,
              componentRoot.scale
            );
            componentRoot.updateWorldMatrix(true, true);
          }

          function componentRoot(
            definition: ComponentDefinition,
            importMatrixWorld: THREE.Matrix4
          ): THREE.Object3D {
            const root = new THREE.Group();
            root.name = 'AppleCutterImportComponent';
            for (const geometry of definition.parts) {
              root.add(new THREE.Mesh(geometry, PLACEHOLDER_MATERIAL));
            }
            syncRootTransform(root, importMatrixWorld);
            return root;
          }

          function componentSignature(root: THREE.Object3D): string {
            root.updateWorldMatrix(true, true);
            const inverseRoot = root.matrixWorld.clone().invert();
            const meshes: unknown[] = [];
            root.traverseVisible((child) => {
              const mesh = child as THREE.Mesh<THREE.BufferGeometry>;
              if (!mesh.isMesh || !mesh.geometry) return;
              const position = mesh.geometry.getAttribute('position');
              const index = mesh.geometry.getIndex();
              const relativeMatrix = inverseRoot.clone().multiply(mesh.matrixWorld);
              meshes.push({
                node: mesh.uuid,
                geometry: mesh.geometry.uuid,
                positionCount: position?.count ?? 0,
                positionVersion: position?.version ?? 0,
                indexCount: index?.count ?? 0,
                indexVersion: index?.version ?? 0,
                matrix: relativeMatrix.elements.map((value) => Number(value.toFixed(6)))
              });
            });
            return JSON.stringify({
              directChildren: root.children.map((child) => ({
                node: child.uuid,
                visible: child.visible,
                mesh: (child as THREE.Mesh).isMesh === true,
                childCount: child.children.length
              })),
              meshes
            });
          }

          function disposeComponentRoots(roots: readonly THREE.Object3D[]): void {
            for (const root of roots) {
              root.traverse((child) => {
                const mesh = child as THREE.Mesh<THREE.BufferGeometry>;
                if (mesh.isMesh) mesh.geometry.dispose();
              });
            }
          }

          /**
           * Bestmögliche Komponentenheuristik für Fremdimporte:
           * - explizite direkte Gruppen bleiben eigene Komponenten,
           * - berührende direkte Mesh-Aufteilungen werden zusammengefasst,
           * - räumlich getrennte Meshes bleiben getrennt,
           * - getrennte Dreiecksinseln eines Meshes bleiben getrennt.
           */
          export function buildImportedComponentRoots(root: THREE.Object3D): THREE.Object3D[] {
            root.updateWorldMatrix(true, true);
            const signature = componentSignature(root);
            const cached = componentRootCache.get(root);
            if (cached?.signature === signature) {
              cached.roots.forEach((component) => syncRootTransform(component, root.matrixWorld));
              return cached.roots;
            }
            if (cached) disposeComponentRoots(cached.roots);

            const inverseRoot = root.matrixWorld.clone().invert();
            const definitions: ComponentDefinition[] = [];
            const directParts: DirectPart[] = [];

            if ((root as THREE.Mesh).isMesh) {
              const mesh = root as THREE.Mesh<THREE.BufferGeometry>;
              const parts = geometryPartsForNode(mesh, inverseRoot);
              parts.forEach((part, islandIndex) => {
                const bounds = boundsForParts([part.geometry]);
                directParts.push({
                  order: islandIndex,
                  sourceMesh: part.sourceMesh,
                  geometry: part.geometry,
                  bounds
                });
              });
            } else {
              root.children.forEach((child, childIndex) => {
                if (!child.visible || !containsVisibleMesh(child)) return;
                if ((child as THREE.Mesh).isMesh) {
                  const parts = geometryPartsForNode(child, inverseRoot);
                  parts.forEach((part, islandIndex) => {
                    const bounds = boundsForParts([part.geometry]);
                    directParts.push({
                      order: childIndex * 100000 + islandIndex,
                      sourceMesh: part.sourceMesh,
                      geometry: part.geometry,
                      bounds
                    });
                  });
                  return;
                }

                const parts = geometryPartsForNode(child, inverseRoot)
                  .map((part) => part.geometry);
                if (parts.length > 0) {
                  definitions.push({
                    order: childIndex * 100000,
                    parts
                  });
                }
              });
            }

            definitions.push(...clusterDirectParts(directParts));
            definitions.sort((left, right) => left.order - right.order);
            const roots = definitions
              .filter((definition) => !boundsForParts(definition.parts).isEmpty())
              .map((definition) => componentRoot(definition, root.matrixWorld));

            componentRootCache.set(root, { signature, roots });
            return roots;
          }
          '''.replace('\n          ', '\n').lstrip(), encoding='utf-8')

          replace_once(
              'src/editor/snapping/objectSurfaceSnap.ts',
              "import { buildGeometrySupportPoints } from './surfaceSupport';\n",
              "import { buildGeometrySupportPoints } from './surfaceSupport';\nimport { buildImportedComponentRoots } from './importComponentAnalysis';\n"
          )
          replace_once(
              'src/editor/snapping/objectSurfaceSnap.ts',
              r'''function containsVisibleMesh(root: THREE.Object3D): boolean {
            let found = false;
            root.traverseVisible((child) => {
              if ((child as THREE.Mesh).isMesh) found = true;
            });
            return found;
          }

          '''.replace('\n          ', '\n'),
              ''
          )
          replace_once(
              'src/editor/snapping/objectSurfaceSnap.ts',
              r'''  const componentRoots = root.children.filter((child) => (
              child.visible && containsVisibleMesh(child)
            ));
            if (componentRoots.length === 0) {
              return {
                composite,
                components: [rescopeTarget(composite, `${id}:component:0`, 'component')]
              };
            }

            const components = componentRoots.flatMap((child, index) => {
              const componentId = `${id}:component:${index}`;
              const target = surfaceSnapTargetFromObject3D(child, componentId);
              return target
                ? [rescopeTarget(target, componentId, 'component')]
                : [];
            });
          '''.replace('\n            ', '\n'),
              r'''  const componentRoots = buildImportedComponentRoots(root);
            if (componentRoots.length === 0) {
              return {
                composite,
                components: [rescopeTarget(composite, `${id}:component:0`, 'component')]
              };
            }

            const components = componentRoots.flatMap((componentRoot, index) => {
              const componentId = `${id}:component:${index}`;
              const target = surfaceSnapTargetFromObject3D(componentRoot, componentId);
              return target
                ? [rescopeTarget(target, componentId, 'component')]
                : [];
            });
          '''.replace('\n            ', '\n')
          )

          replace_once(
              'src/editor/viewport/EditorViewport.tsx',
              "import { findFormSurfaceSnap, isFormType } from '../snapping/primitiveSurfaceSnap';",
              "import { findAppleCutterSurfaceSnap } from '../appleCutter/appleCutterSnap';"
          )
          viewport_path = Path('src/editor/viewport/EditorViewport.tsx')
          viewport = viewport_path.read_text(encoding='utf-8')
          viewport = viewport.replace('findFormSurfaceSnap(', 'findAppleCutterSurfaceSnap(')
          viewport = viewport.replace('if (snap.surface && isFormType(object.type)) {', 'if (snap.surface) {')
          viewport = viewport.replace("    && isFormType(object.type)\n", '')
          if 'isFormType' in viewport or 'findFormSurfaceSnap' in viewport:
              raise SystemExit('Legacy snap references remain in EditorViewport.tsx')
          viewport_path.write_text(viewport, encoding='utf-8')

          replace_once(
              'tests/objectSurfaceSnap.test.ts',
              "import { isFormType } from '../src/editor/snapping/primitiveSurfaceSnap';\n",
              ''
          )
          replace_once(
              'tests/objectSurfaceSnap.test.ts',
              r'''
            it.each(SHAPE_DEFINITIONS)("filtert '$label' nicht mehr nach Typ", ({ type }) => {
              expect(isFormType(type)).toBe(true);
            });
          '''.replace('\n            ', '\n'),
              ''
          )

          replace_once(
              'tests/sweptObjectSurfaceSnap.test.ts',
              "import { findFormSurfaceSnap } from '../src/editor/snapping/primitiveSurfaceSnap';",
              "import { findAppleCutterSurfaceSnap } from '../src/editor/appleCutter/appleCutterSnap';"
          )
          swept_path = Path('tests/sweptObjectSurfaceSnap.test.ts')
          swept = swept_path.read_text(encoding='utf-8')
          swept = swept.replace('findFormSurfaceSnap', 'findAppleCutterSurfaceSnap')
          swept_path.write_text(swept, encoding='utf-8')

          replace_once(
              'tests/appleCutterComposite.test.ts',
              r'''  it('behandelt direkte Mesh-Nodes als getrennte Komponenten plus äußere Hülle', () => {
              const root = new THREE.Group();
              const wall = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 0.2));
              wall.position.x = -0.5;
              const roof = new THREE.Mesh(new THREE.ConeGeometry(0.8, 0.7, 4));
              roof.position.set(0.4, 0.8, 0);
              root.add(wall, roof);

              const analysis = analyzeImportedObject3DSnapTargets(root, 'imported-house');

              expect(analysis.composite?.scope).toBe('composite');
              expect(analysis.composite?.anchors.length).toBeGreaterThan(0);
              expect(analysis.components).toHaveLength(2);
              expect(analysis.components.every((target) => target.scope === 'component')).toBe(true);
              expect(analysis.components.every((target) => target.anchors.length > 0)).toBe(true);
              expect(new Set(analysis.components.map((target) => target.id)).size).toBe(2);

              wall.geometry.dispose();
              roof.geometry.dispose();
            });
          '''.replace('\n              ', '\n'),
              r'''  it('fasst berührende direkte Mesh-Nodes als eine logische Komponente zusammen', () => {
              const root = new THREE.Group();
              const wall = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 0.2));
              wall.position.x = -0.5;
              const roof = new THREE.Mesh(new THREE.ConeGeometry(0.8, 0.7, 4));
              roof.position.set(0.4, 0.8, 0);
              root.add(wall, roof);

              const analysis = analyzeImportedObject3DSnapTargets(root, 'imported-house');

              expect(analysis.composite?.scope).toBe('composite');
              expect(analysis.composite?.anchors.length).toBeGreaterThan(0);
              expect(analysis.components).toHaveLength(1);
              expect(analysis.components[0]?.scope).toBe('component');
              expect(analysis.components[0]?.anchors.length).toBeGreaterThan(0);

              wall.geometry.dispose();
              roof.geometry.dispose();
            });

            it('erzeugt bei reinen berührenden Materialaufteilungen keine Scheinkomponenten', () => {
              const root = new THREE.Group();
              const left = new THREE.Mesh(
                new THREE.BoxGeometry(0.5, 1, 1),
                new THREE.MeshBasicMaterial({ color: '#ff0000' })
              );
              const right = new THREE.Mesh(
                new THREE.BoxGeometry(0.5, 1, 1),
                new THREE.MeshBasicMaterial({ color: '#0000ff' })
              );
              left.position.x = -0.25;
              right.position.x = 0.25;
              root.add(left, right);

              const analysis = analyzeImportedObject3DSnapTargets(root, 'material-split');

              expect(analysis.components).toHaveLength(1);
              left.geometry.dispose();
              right.geometry.dispose();
              (left.material as THREE.Material).dispose();
              (right.material as THREE.Material).dispose();
            });

            it('erkennt getrennte Dreiecksinseln eines einzelnen Meshes als Komponenten', () => {
              const geometry = new THREE.BufferGeometry();
              geometry.setAttribute('position', new THREE.Float32BufferAttribute([
                0, 0, 0, 1, 0, 0, 0, 1, 0,
                3, 0, 0, 4, 0, 0, 3, 1, 0
              ], 3));
              geometry.computeVertexNormals();
              const root = new THREE.Mesh(geometry);

              const analysis = analyzeImportedObject3DSnapTargets(root, 'island-import');

              expect(analysis.composite).not.toBeNull();
              expect(analysis.components).toHaveLength(2);
              expect(new Set(analysis.components.map((target) => target.id)).size).toBe(2);
              geometry.dispose();
            });
          '''.replace('\n              ', '\n')
          )

          replace_once(
              'src/editor/appleCutter/appleCutterTypes.ts',
              '  standardStep: Vec3;\n  scope: AppleCutterScope;',
              '  standardStep: Vec3;\n  baseCutCount: readonly [4, 4, 4];\n  scope: AppleCutterScope;'
          )

          legacy_path = Path('src/editor/snapping/primitiveSurfaceSnap.ts')
          if not legacy_path.exists():
              raise SystemExit('Legacy primitiveSurfaceSnap.ts is already missing unexpectedly')
          legacy_path.unlink()

          workflow_path = Path('.github/workflows/apply-apple-cutter-finalization.yml')
          workflow_path.unlink()

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Commit verified migration
        run: |
          git config user.name "NorthCore Automation"
          git config user.email "automation@northcore-eu.de"
          git add \
            src/editor/appleCutter/appleCutterSnap.ts \
            src/editor/appleCutter/appleCutterTypes.ts \
            src/editor/snapping/importComponentAnalysis.ts \
            src/editor/snapping/objectSurfaceSnap.ts \
            src/editor/snapping/primitiveSurfaceSnap.ts \
            src/editor/viewport/EditorViewport.tsx \
            tests/appleCutterComposite.test.ts \
            tests/objectSurfaceSnap.test.ts \
            tests/sweptObjectSurfaceSnap.test.ts \
            .github/workflows/apply-apple-cutter-finalization.yml
          git commit -m "Apfelschneider-Migration abschließen"
          git push origin HEAD:feature/apple-cutter-model

      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: asset-editor-apple-cutter-final-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
