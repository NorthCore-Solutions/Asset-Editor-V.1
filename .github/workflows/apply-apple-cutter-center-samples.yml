name: Apply Apple Cutter Center Samples

on:
  push:
    branches:
      - feature/apple-cutter-model

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/apple-cutter-model
          fetch-depth: 0
      - name: Add center sampling coordinates
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/editor/snapping/surfaceSnapTopology.ts')
          source = path.read_text(encoding='utf-8')
          old = """  const grids: [number[], number[], number[]] = [
    axisGrids[0].coordinates,
    axisGrids[1].coordinates,
    axisGrids[2].coordinates
  ];"""
          new = """  // Die Mittelpunktachsen sind Referenzlinien für die Oberflächenabtastung,
  // aber keine zusätzlichen Schnitte und verändern daher keine Kachelgröße.
  // Sie sichern insbesondere bei kleinen und runden Körpern die exakten
  // symmetrischen Außenpunkte entlang X, Y und Z.
  const samplingCoordinates = (axisGrid: (typeof axisGrids)[number]): number[] => (
    [...new Set([...axisGrid.coordinates, axisGrid.center])]
      .sort((left, right) => left - right)
  );
  const grids: [number[], number[], number[]] = [
    samplingCoordinates(axisGrids[0]),
    samplingCoordinates(axisGrids[1]),
    samplingCoordinates(axisGrids[2])
  ];"""
          if old not in source:
              raise SystemExit('Zielblock für Mittelpunktachsen nicht gefunden')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git rm .github/workflows/apply-apple-cutter-center-samples.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editor/snapping/surfaceSnapTopology.ts
          git commit -m "Apfelschneider-Mittelachsen als Abtastlinien ergänzen"
          git push origin HEAD:feature/apple-cutter-model
