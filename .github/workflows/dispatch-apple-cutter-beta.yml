name: Dispatch Apple Cutter Beta

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-apple-cutter-beta.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Dispatch signed beta update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-beta-live-update.yml \
            --repo NorthCore-Solutions/Asset-Editor-V.1 \
            --ref main \
            -f bundle_id=2-2026.08.07.18 \
            -f native_version_code=2

      - name: Remove one-shot dispatcher
        run: |
          git config user.name "NorthCore Automation"
          git config user.email "automation@northcore-eu.de"
          git rm .github/workflows/dispatch-apple-cutter-beta.yml
          git commit -m "Temporären Beta-Dispatcher entfernen"
          git push origin HEAD:main
