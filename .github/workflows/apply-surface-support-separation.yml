name: Apply Surface Support Separation

on:
  push:
    branches:
      - feature/apple-cutter-model

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/apple-cutter-model
          fetch-depth: 0
      - name: Separate cutter anchors from geometry support points
        run: |
          python - <<'PY'
          from pathlib import Path

          topology_path = Path('src/editor/snapping/surfaceSnapTopology.ts')
          topology = topology_path.read_text(encoding='utf-8')
          old_sampling = """  // Die Mittelpunktachsen sind Referenzlinien für die Oberflächenabtastung,
  // aber keine zusätzlichen Schnitte und verändern daher keine Kachelgröße.
  // Sie sichern insbesondere bei kleinen und runden Körpern die exakten
  // symmetrischen Außenpunkte entlang X, Y und Z.
  const samplingCoordinates = (axisGrid: (typeof axisGrids)[number]): number[] => (
    [...new Set([...axisGrid.coordinates, axisGrid.center])]
      .sort((left, right) => left - right)
  );"""
          new_sampling = """  // Eine Mittelpunktachse wird nur benötigt, wenn die gesamte Form auf
  // dieser Achse kleiner als eine einzelne 0,25-Kachel ist und deshalb keinen
  // regulären Schnitt besitzt. Bei normalen Formen entstehen keine zusätzlichen
  // inneren Snap-Punkte zwischen den festgelegten Schnitten.
  const samplingCoordinates = (axisGrid: (typeof axisGrids)[number]): number[] => (
    axisGrid.cuts.length === 0
      ? [...new Set([...axisGrid.coordinates, axisGrid.center])]
        .sort((left, right) => left - right)
      : axisGrid.coordinates
  );"""
          if old_sampling not in topology:
              raise SystemExit('Mittelachsenblock nicht gefunden')
          topology_path.write_text(topology.replace(old_sampling, new_sampling, 1), encoding='utf-8')

          object_path = Path('src/editor/snapping/objectSurfaceSnap.ts')
          source = object_path.read_text(encoding='utf-8')
          import_marker = "import { removeOpposingCoincidentAnchors } from './compositeAnchorFilter';\n"
          support_import = "import { buildGeometrySupportPoints } from './surfaceSupport';\n"
          if support_import not in source:
              if import_marker not in source:
                  raise SystemExit('Support-Importposition nicht gefunden')
              source = source.replace(import_marker, import_marker + support_import, 1)

          source = source.replace(
              "interface CachedTopology {\n  localBounds: THREE.Box3;\n  anchors: SurfaceSnapAnchor[];\n}",
              "interface CachedTopology {\n  localBounds: THREE.Box3;\n  anchors: SurfaceSnapAnchor[];\n  supportPoints: THREE.Vector3[];\n}",
              1,
          )
          source = source.replace(
              "  anchors: SurfaceSnapAnchor[];\n  scope?: AppleCutterScope;",
              "  anchors: SurfaceSnapAnchor[];\n  supportPoints?: THREE.Vector3[];\n  scope?: AppleCutterScope;",
              1,
          )
          source = source.replace(
              "      localBounds: cached.localBounds.clone(),\n      anchors: cached.anchors",
              "      localBounds: cached.localBounds.clone(),\n      anchors: cached.anchors,\n      supportPoints: cached.supportPoints",
          )

          component_old = """    if (anchors.length === 0) return null;

    const topology = { localBounds, anchors };"""
          component_new = """    const supportPoints = buildGeometrySupportPoints(geometry);
    if (anchors.length === 0 || supportPoints.length === 0) return null;

    const topology = { localBounds, anchors, supportPoints };"""
          if component_old not in source:
              raise SystemExit('Komponenten-Supportblock nicht gefunden')
          source = source.replace(component_old, component_new, 1)
          source = source.replace(
              "      localBounds: localBounds.clone(),\n      anchors\n",
              "      localBounds: localBounds.clone(),\n      anchors,\n      supportPoints\n",
              1,
          )

          composite_old = """    const anchors = externalCompositeAnchors(rawAnchors, parts);
    return anchors.length > 0 ? { localBounds, anchors } : null;"""
          composite_new = """    const anchors = externalCompositeAnchors(rawAnchors, parts);
    const supportPoints = buildGeometrySupportPoints(geometry);
    return anchors.length > 0 && supportPoints.length > 0
      ? { localBounds, anchors, supportPoints }
      : null;"""
          if composite_old not in source:
              raise SystemExit('Composite-Supportblock nicht gefunden')
          source = source.replace(composite_old, composite_new, 1)

          source = source.replace(
              "        localBounds: topology.localBounds.clone(),\n        anchors: topology.anchors",
              "        localBounds: topology.localBounds.clone(),\n        anchors: topology.anchors,\n        supportPoints: topology.supportPoints",
          )
          source = source.replace(
              "    anchors: topology.anchors,\n    scope:",
              "    anchors: topology.anchors,\n    supportPoints: topology.supportPoints,\n    scope:",
          )
          source = source.replace(
              "        localBounds: topology.localBounds.clone(),\n        anchors: topology.anchors\n      }, COMPOSITE_CACHE_LIMIT);",
              "        localBounds: topology.localBounds.clone(),\n        anchors: topology.anchors,\n        supportPoints: topology.supportPoints\n      }, COMPOSITE_CACHE_LIMIT);",
              1,
          )

          if 'supportPoints: topology.supportPoints' not in source:
              raise SystemExit('Supportpunkte wurden nicht an Ziele gebunden')
          object_path.write_text(source, encoding='utf-8')
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git rm .github/workflows/apply-surface-support-separation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editor/snapping/surfaceSnapTopology.ts src/editor/snapping/objectSurfaceSnap.ts
          git commit -m "Apfelschneider-Punkte von Oberflächenstützen trennen"
          git push origin HEAD:feature/apple-cutter-model

# Regulärer Push zur Ausführung des temporären Patches.
