name: Apply Explicit Transform Pivots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply explicit transform pivots
        run: python .github/scripts/apply_explicit_transform_pivots.py

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build web app
        run: npm run build

      - name: Commit verified pivot cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/apply_explicit_transform_pivots.py
          rm .github/workflows/trigger-explicit-transform-pivots.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editor/paint/useSurfacePaint.ts src/editor/viewport/EditorViewport.tsx .github/scripts/apply_explicit_transform_pivots.py .github/workflows/trigger-explicit-transform-pivots.yml
          git commit -m "Transformations-Pivots explizit verwalten"
          git push origin HEAD:main
