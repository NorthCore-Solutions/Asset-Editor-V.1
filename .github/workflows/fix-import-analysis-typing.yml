name: Fix Import Analysis Typing

on:
  push:
    branches:
      - feature/apple-cutter-model
    paths:
      - .github/workflows/fix-import-analysis-typing.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/apple-cutter-model
          fetch-depth: 0

      - name: Apply strict typing fix
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/editor/snapping/importComponentAnalysis.ts')
          source = path.read_text(encoding='utf-8')
          old = """  const triangleCount = positions?.itemSize >= 3
            ? Math.floor(positions.count / 3)
            : 0;
          """.replace('\n          ', '\n')
          new = """  const triangleCount = positions && positions.itemSize >= 3
            ? Math.floor(positions.count / 3)
            : 0;
          """.replace('\n          ', '\n')
          if old not in source:
              raise SystemExit('Expected triangle-count block not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/fix-import-analysis-typing.yml').unlink()

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify TypeScript build
        run: |
          npm ci
          npm run build

      - name: Commit fix
        run: |
          git config user.name "NorthCore Automation"
          git config user.email "automation@northcore-eu.de"
          git add src/editor/snapping/importComponentAnalysis.ts .github/workflows/fix-import-analysis-typing.yml
          git commit -m "Import-Inselanalyse strikt typisieren"
          git pull --rebase origin feature/apple-cutter-model
          git push origin HEAD:feature/apple-cutter-model
