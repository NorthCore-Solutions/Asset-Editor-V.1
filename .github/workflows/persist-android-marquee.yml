name: Persist Android marquee mode

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep Android marquee armed after selection
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/editor/viewport/EditorViewport.tsx')
          content = path.read_text(encoding='utf-8')

          old = '''    const startedFromAndroidButton = marqueeFromAndroidButtonRef.current;
    removeMarqueeListeners();
    marqueeRef.current = null;
    marqueeFromAndroidButtonRef.current = false;
    setMarquee(null);
    if (startedFromAndroidButton) setAndroidMarqueeArmed(false);
'''
          new = '''    removeMarqueeListeners();
    marqueeRef.current = null;
    marqueeFromAndroidButtonRef.current = false;
    setMarquee(null);
'''

          if old not in content:
              raise SystemExit('Expected Android marquee completion block not found')

          path.write_text(content.replace(old, new, 1), encoding='utf-8')

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/persist-android-marquee.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editor/viewport/EditorViewport.tsx .github/workflows/persist-android-marquee.yml
          git commit -m "Android-Auswahlmodus dauerhaft aktiv halten"
          git push origin HEAD:${{ github.head_ref }}
