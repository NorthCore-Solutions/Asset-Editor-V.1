name: Adjust Scale Handle Sizes

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scale-handle-size-trigger'

permissions:
  contents: write

jobs:
  adjust-scale-handles:
    if: github.head_ref == 'build/scale-handles-2026-08-05'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Adjust visual sizes and hitboxes
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/editor/viewport/EditorViewport.tsx')
          source = path.read_text(encoding='utf-8')

          constants_old = """const SCALE_HANDLE_SIZE_RATIO = 0.06;
          const CORNERS: CornerSides[] = [
          """.replace('          ', '')
          constants_new = """const SCALE_HANDLE_SIZE_RATIO = 0.06;
          const CENTER_SCALE_VISUAL_RADIUS = 0.11;
          const CENTER_SCALE_HITBOX_RADIUS = 0.28;
          const CORNER_SCALE_VISUAL_SIZE = 1.16;
          const CORNER_SCALE_HITBOX_SIZE = 1.55;
          const CORNERS: CornerSides[] = [
          """.replace('          ', '')

          center_old = """      <mesh renderOrder={Infinity}>
                  <octahedronGeometry args={[0.1, 0]} />
          """.replace('          ', '')
          center_new = """      <mesh renderOrder={Infinity}>
                  <octahedronGeometry args={[CENTER_SCALE_VISUAL_RADIUS, 0]} />
          """.replace('          ', '')

          center_hitbox_old = """      <mesh renderOrder={Infinity} onPointerDown={onPointerDown}>
                  <octahedronGeometry args={[0.2, 0]} />
          """.replace('          ', '')
          center_hitbox_new = """      <mesh renderOrder={Infinity} onPointerDown={onPointerDown}>
                  <octahedronGeometry args={[CENTER_SCALE_HITBOX_RADIUS, 0]} />
          """.replace('          ', '')

          corner_old = """function CornerScaleHandle({ mesh, bounds, sides, onPointerDown }: {
            mesh: THREE.Mesh;
            bounds: THREE.Box3;
            sides: CornerSides;
            onPointerDown: (sides: CornerSides, event: ThreeEvent<PointerEvent>) => void;
          }) {
            const handleRef = useRef<THREE.Mesh>(null);
            const camera = useThree((state) => state.camera);
          
            useFrame(() => {
              const handle = handleRef.current;
              if (!handle) return;
              mesh.updateMatrixWorld();
              const localPoint = cornerPoint(bounds, sides);
              handle.position.copy(mesh.localToWorld(localPoint));
              handle.quaternion.copy(camera.quaternion);
              handle.scale.setScalar((scaleHandleWorldSize(mesh, bounds) * 1.08) / 1.05);
            });
          
            return (
              <mesh ref={handleRef} renderOrder={1001} onPointerDown={(event) => onPointerDown(sides, event)}>
                <planeGeometry args={[1.05, 1.05]} />
                <meshBasicMaterial color=\"#ffff00\" transparent opacity={0.48} side={THREE.DoubleSide} depthTest={false} depthWrite={false} toneMapped={false} />
              </mesh>
            );
          }
          """.replace('          ', '')

          corner_new = """function CornerScaleHandle({ mesh, bounds, sides, onPointerDown }: {
            mesh: THREE.Mesh;
            bounds: THREE.Box3;
            sides: CornerSides;
            onPointerDown: (sides: CornerSides, event: ThreeEvent<PointerEvent>) => void;
          }) {
            const handleRef = useRef<THREE.Group>(null);
            const camera = useThree((state) => state.camera);
          
            useFrame(() => {
              const handle = handleRef.current;
              if (!handle) return;
              mesh.updateMatrixWorld();
              const localPoint = cornerPoint(bounds, sides);
              handle.position.copy(mesh.localToWorld(localPoint));
              handle.quaternion.copy(camera.quaternion);
              handle.scale.setScalar(scaleHandleWorldSize(mesh, bounds));
            });
          
            return (
              <group ref={handleRef} renderOrder={1001}>
                <mesh renderOrder={1001}>
                  <planeGeometry args={[CORNER_SCALE_VISUAL_SIZE, CORNER_SCALE_VISUAL_SIZE]} />
                  <meshBasicMaterial color=\"#ffff00\" transparent opacity={0.48} side={THREE.DoubleSide} depthTest={false} depthWrite={false} toneMapped={false} />
                </mesh>
                <mesh renderOrder={1002} onPointerDown={(event) => onPointerDown(sides, event)}>
                  <planeGeometry args={[CORNER_SCALE_HITBOX_SIZE, CORNER_SCALE_HITBOX_SIZE]} />
                  <meshBasicMaterial transparent opacity={0} side={THREE.DoubleSide} depthTest={false} depthWrite={false} toneMapped={false} />
                </mesh>
              </group>
            );
          }
          """.replace('          ', '')

          replacements = [
            (constants_old, constants_new),
            (center_old, center_new),
            (center_hitbox_old, center_hitbox_new),
            (corner_old, corner_new),
          ]

          for old, new in replacements:
            if source.count(old) != 1:
              raise RuntimeError(f'Expected exactly one matching block, found {source.count(old)}')
            source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run build
        run: npm run build

      - name: Run lint
        run: npm run lint

      - name: Verify unchanged transform sizing and scale logic
        shell: bash
        run: |
          grep -q "size={tool === 'rotate' ? 1.4 : 1.15}" src/editor/viewport/EditorViewport.tsx
          grep -q "pixelsPerFactor: 140" src/editor/viewport/EditorViewport.tsx
          grep -q "const SCALE_HANDLE_SIZE_RATIO = 0.06" src/editor/viewport/EditorViewport.tsx
          grep -q "CORNER_SCALE_HITBOX_SIZE = 1.55" src/editor/viewport/EditorViewport.tsx
          grep -q "CENTER_SCALE_HITBOX_RADIUS = 0.28" src/editor/viewport/EditorViewport.tsx
          git diff --check

      - name: Commit adjustment to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editor/viewport/EditorViewport.tsx
          git commit -m "Skalierpunkte und Hitboxen leicht vergrößern"
          git push origin HEAD:main
