name: Paint Autosave Restore Check

on:
  push:
    branches:
      - fix/paint-autosave-restore

permissions:
  contents: write

jobs:
  patch-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/paint-autosave-restore

      - name: Accept paint grid version 2
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/persistence/projectFile.ts')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "  if (value.version !== 1) throw new Error(`Objekt ${objectIndex + 1}: Unbekannte Flächenraster-Version.`);",
                  "  if (value.version !== 1 && value.version !== 2) {\n    throw new Error(`Objekt ${objectIndex + 1}: Unbekannte Flächenraster-Version.`);\n  }"
              ),
              (
                  "    version: 1,\n    atlasSignature: value.atlasSignature,",
                  "    version: value.version,\n    atlasSignature: value.atlasSignature,"
              )
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint
      - run: npx cap sync android

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Commit tested fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/persistence/projectFile.ts
          git commit -m "Bemalte Autosaves wiederherstellen"
          git push origin HEAD:fix/paint-autosave-restore
