name: Setup Self-Hosted Live Updates

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/live-update-setup-trigger'

permissions:
  contents: write

jobs:
  setup-live-updates:
    if: github.head_ref == 'build/live-update-setup-2026-08-05'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Live Update plugin
        run: npm install @capawesome/capacitor-live-update@8.3.0 --save-exact

      - name: Add Live Update runtime
        shell: bash
        run: |
          mkdir -p src/platform scripts

          cat > src/platform/liveUpdate.ts <<'EOF'
          import { Capacitor } from '@capacitor/core';
          import { LiveUpdate } from '@capawesome/capacitor-live-update';

          const LIVE_UPDATE_MANIFEST_URL = 'https://northcore-eu.de/updates/asset-editor/beta/manifest.json';
          const MANIFEST_TIMEOUT_MS = 10_000;
          const BUNDLE_ID_PATTERN = /^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$/;
          const CHECKSUM_PATTERN = /^[a-f0-9]{64}$/i;
          const BASE64_PATTERN = /^[A-Za-z0-9+/]+={0,2}$/;

          export interface LiveUpdateManifest {
            schemaVersion: 1;
            bundleId: string;
            downloadUrl: string;
            checksum: string;
            signature: string;
            minimumNativeVersionCode: number;
            maximumNativeVersionCode: number;
          }

          const isRecord = (value: unknown): value is Record<string, unknown> => (
            typeof value === 'object' && value !== null && !Array.isArray(value)
          );

          const isHttpsUrl = (value: string): boolean => {
            try {
              return new URL(value).protocol === 'https:';
            } catch {
              return false;
            }
          };

          export function parseLiveUpdateManifest(value: unknown): LiveUpdateManifest {
            if (!isRecord(value)) throw new Error('Live-Update-Manifest ist kein Objekt.');

            const manifest = value as Partial<LiveUpdateManifest>;
            if (manifest.schemaVersion !== 1) throw new Error('Unbekannte Manifest-Version.');
            if (typeof manifest.bundleId !== 'string' || !BUNDLE_ID_PATTERN.test(manifest.bundleId) || manifest.bundleId === 'public') {
              throw new Error('Ungültige Bundle-ID.');
            }
            if (typeof manifest.downloadUrl !== 'string' || !isHttpsUrl(manifest.downloadUrl)) {
              throw new Error('Bundle-URL muss HTTPS verwenden.');
            }
            if (typeof manifest.checksum !== 'string' || !CHECKSUM_PATTERN.test(manifest.checksum)) {
              throw new Error('Ungültige SHA-256-Prüfsumme.');
            }
            if (typeof manifest.signature !== 'string' || !BASE64_PATTERN.test(manifest.signature)) {
              throw new Error('Ungültige Bundle-Signatur.');
            }
            if (!Number.isInteger(manifest.minimumNativeVersionCode) || (manifest.minimumNativeVersionCode ?? 0) < 1) {
              throw new Error('Ungültige minimale native Version.');
            }
            if (!Number.isInteger(manifest.maximumNativeVersionCode)
              || (manifest.maximumNativeVersionCode ?? 0) < (manifest.minimumNativeVersionCode ?? 0)) {
              throw new Error('Ungültige maximale native Version.');
            }

            return manifest as LiveUpdateManifest;
          }

          const fetchManifest = async (): Promise<LiveUpdateManifest> => {
            const controller = new AbortController();
            const timeoutId = window.setTimeout(() => controller.abort(), MANIFEST_TIMEOUT_MS);
            const requestUrl = new URL(LIVE_UPDATE_MANIFEST_URL);
            requestUrl.searchParams.set('_', Date.now().toString());

            try {
              const response = await fetch(requestUrl, {
                cache: 'no-store',
                headers: { Accept: 'application/json' },
                signal: controller.signal
              });
              if (!response.ok) throw new Error(`Manifest-Abruf fehlgeschlagen (${response.status}).`);
              return parseLiveUpdateManifest(await response.json());
            } finally {
              window.clearTimeout(timeoutId);
            }
          };

          let initializationStarted = false;

          export async function initializeLiveUpdates(): Promise<void> {
            if (initializationStarted) return;
            initializationStarted = true;

            if (!Capacitor.isNativePlatform() || Capacitor.getPlatform() !== 'android') return;

            try {
              const readyResult = await LiveUpdate.ready();
              if (readyResult.rollback) {
                console.warn('Live Update wurde auf das integrierte Bundle zurückgesetzt.', readyResult);
              }
            } catch (error) {
              console.warn('Live Update konnte nicht als bereit markiert werden.', error);
              return;
            }

            try {
              const manifest = await fetchManifest();
              const [versionResult, currentResult, nextResult, downloadedResult, blockedResult] = await Promise.all([
                LiveUpdate.getVersionCode(),
                LiveUpdate.getCurrentBundle(),
                LiveUpdate.getNextBundle(),
                LiveUpdate.getDownloadedBundles(),
                LiveUpdate.getBlockedBundles()
              ]);

              const nativeVersionCode = Number.parseInt(versionResult.versionCode, 10);
              if (!Number.isInteger(nativeVersionCode)
                || nativeVersionCode < manifest.minimumNativeVersionCode
                || nativeVersionCode > manifest.maximumNativeVersionCode) return;

              if (currentResult.bundleId === manifest.bundleId || nextResult.bundleId === manifest.bundleId) return;
              if (blockedResult.bundleIds.includes(manifest.bundleId)) {
                console.warn(`Live-Update-Bundle ${manifest.bundleId} ist nach einem Rollback blockiert.`);
                return;
              }

              if (!downloadedResult.bundleIds.includes(manifest.bundleId)) {
                await LiveUpdate.downloadBundle({
                  artifactType: 'zip',
                  bundleId: manifest.bundleId,
                  checksum: manifest.checksum,
                  signature: manifest.signature,
                  url: manifest.downloadUrl
                });
              }

              await LiveUpdate.setNextBundle({ bundleId: manifest.bundleId });
              console.info(`Live-Update-Bundle ${manifest.bundleId} wird beim nächsten App-Start aktiviert.`);
            } catch (error) {
              console.warn('Live-Update-Prüfung wurde ohne Änderung beendet.', error);
            }
          }
          EOF

          cat > src/main.tsx <<'EOF'
          import { StrictMode } from 'react';
          import { createRoot } from 'react-dom/client';
          import { App } from './app/App';
          import { initializeLiveUpdates } from './platform/liveUpdate';
          import './styles/global.css';

          const root = document.getElementById('root');
          if (!root) throw new Error('Root-Element fehlt.');
          createRoot(root).render(<StrictMode><App /></StrictMode>);
          void initializeLiveUpdates();
          EOF

          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const liveUpdatePublicKey = `-----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAzlQ0cuzPL1a0aVttFOkG
          5DkzNK1pW4/AiDNcYbiYx7DYSysKjPeGGvFTL/gI9MN7QyjOh4h00rCy6kKB+nQy
          AC/yWEG3ipu6qH/Vqr+qBP+VEarqiz8qQFL5T14KZi5y/WoQE0p+qME7D3Mzwkg/
          UwPBycOkDV89neoun2dcnACkT/YWkB4UGDBLmOK6vvN0PpCrK02R/6d3IweZf3PM
          9QNIsP+7R/a8X2uqvjJOV9Rn6r/8IlKzsqiARJ8gj8Tt2ymQpTlO0e1Tp/yXEduB
          V+xmr3UKp19NcxvomutMxyQrDBfCrci6n5KUbH/59QeIt7MVeM/nnVr+qPcO7Wlh
          HbVEJSDndZupT9uG5fbXJxLEGD8waf/DnA8gZj9AyhaNqfy93IKh0KPdd4v+ZVKw
          tsL62TweQYQf0Iqh240p+SlVkSYjFnOT+09uHoQRGItKBRGtr6ICBzCTFzrM1Atx
          hBe8S5T48HIDCBlcmMyz5ODHoG0vC57SAj6QM86PliaxAgMBAAE=
          -----END PUBLIC KEY-----`;

          const config: CapacitorConfig = {
            appId: 'de.northcore.asseteditor',
            appName: 'NorthCore Asset Editor',
            webDir: 'dist',
            android: {
              allowMixedContent: false
            },
            plugins: {
              LiveUpdate: {
                autoBlockRolledBackBundles: true,
                autoDeleteBundles: true,
                autoUpdateStrategy: 'none',
                publicKey: liveUpdatePublicKey,
                readyTimeout: 10_000
              }
            }
          };

          export default config;
          EOF

          cat > scripts/sign-live-update-bundle.mjs <<'EOF'
          import { createHash, sign } from 'node:crypto';
          import { readFile, writeFile } from 'node:fs/promises';
          import path from 'node:path';
          import process from 'node:process';

          const [zipPath, privateKeyPath, bundleId, baseUrl, nativeVersionCode, manifestPath] = process.argv.slice(2);
          if (!zipPath || !privateKeyPath || !bundleId || !baseUrl || !nativeVersionCode || !manifestPath) {
            throw new Error('Argumente: ZIP, PrivateKey, BundleId, BaseUrl, NativeVersionCode, ManifestPath');
          }

          const zipBytes = await readFile(zipPath);
          const privateKey = await readFile(privateKeyPath, 'utf8');
          const checksum = createHash('sha256').update(zipBytes).digest('hex');
          const signature = sign('RSA-SHA256', zipBytes, privateKey).toString('base64');
          const normalizedBaseUrl = baseUrl.replace(/\/+$/, '');
          const versionCode = Number.parseInt(nativeVersionCode, 10);
          if (!Number.isInteger(versionCode) || versionCode < 1) throw new Error('Ungültiger NativeVersionCode.');

          const manifest = {
            schemaVersion: 1,
            bundleId,
            downloadUrl: `${normalizedBaseUrl}/bundles/${path.basename(zipPath)}`,
            checksum,
            signature,
            minimumNativeVersionCode: versionCode,
            maximumNativeVersionCode: versionCode
          };

          await writeFile(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`, 'utf8');
          EOF

          cat > scripts/create-beta-update.ps1 <<'EOF'
          param(
              [Parameter(Mandatory = $true)]
              [ValidatePattern('^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$')]
              [string]$BundleId,

              [Parameter(Mandatory = $true)]
              [string]$PrivateKeyPath,

              [string]$BaseUrl = 'https://northcore-eu.de/updates/asset-editor/beta',
              [int]$NativeVersionCode = 2,
              [string]$OutputDirectory = 'live-update-output'
          )

          $ErrorActionPreference = 'Stop'
          Set-Location (Split-Path $PSScriptRoot -Parent)

          if (-not (Test-Path $PrivateKeyPath)) {
              throw "Privater Live-Update-Schlüssel fehlt: $PrivateKeyPath"
          }

          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Web-Build fehlgeschlagen.' }

          $outputRoot = Join-Path $PWD $OutputDirectory
          $bundleDirectory = Join-Path $outputRoot 'bundles'
          $zipPath = Join-Path $bundleDirectory "$BundleId.zip"
          $manifestPath = Join-Path $outputRoot 'manifest.json'

          Remove-Item $outputRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $bundleDirectory -ItemType Directory -Force | Out-Null
          Compress-Archive -Path '.\dist\*' -DestinationPath $zipPath -CompressionLevel Optimal -Force

          node '.\scripts\sign-live-update-bundle.mjs' `
              $zipPath `
              $PrivateKeyPath `
              $BundleId `
              $BaseUrl `
              $NativeVersionCode `
              $manifestPath

          if ($LASTEXITCODE -ne 0) { throw 'Signierung des Live-Update-Bundles fehlgeschlagen.' }

          @'
          <IfModule mod_headers.c>
            Header always set Access-Control-Allow-Origin "*"
            Header always set Access-Control-Allow-Methods "GET, OPTIONS"
            Header always set Access-Control-Allow-Headers "Content-Type"
          </IfModule>
          '@ | Set-Content (Join-Path $outputRoot '.htaccess') -Encoding ascii

          Write-Host "Live-Update erstellt: $outputRoot"
          Get-Item $zipPath, $manifestPath | Select-Object FullName, Length, LastWriteTime
          EOF

          cat > tests/liveUpdateManifest.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import { parseLiveUpdateManifest } from '../src/platform/liveUpdate';

          const validManifest = {
            schemaVersion: 1,
            bundleId: '2-2026.08.05.1',
            downloadUrl: 'https://northcore-eu.de/updates/asset-editor/beta/bundles/2-2026.08.05.1.zip',
            checksum: 'a'.repeat(64),
            signature: 'c2lnbmF0dXJl',
            minimumNativeVersionCode: 2,
            maximumNativeVersionCode: 2
          };

          describe('Live-Update-Manifest', () => {
            it('akzeptiert ein signiertes HTTPS-Bundle für die passende native Version', () => {
              expect(parseLiveUpdateManifest(validManifest)).toEqual(validManifest);
            });

            it('verwirft unverschlüsselte Bundle-URLs', () => {
              expect(() => parseLiveUpdateManifest({
                ...validManifest,
                downloadUrl: 'http://example.com/update.zip'
              })).toThrow('HTTPS');
            });

            it('verwirft ungültige Prüfsummen und Versionsbereiche', () => {
              expect(() => parseLiveUpdateManifest({ ...validManifest, checksum: 'abc' })).toThrow('Prüfsumme');
              expect(() => parseLiveUpdateManifest({
                ...validManifest,
                minimumNativeVersionCode: 3,
                maximumNativeVersionCode: 2
              })).toThrow('maximale native Version');
            });
          });
          EOF

          python - <<'PY'
          from pathlib import Path

          build_gradle = Path('android/app/build.gradle')
          source = build_gradle.read_text(encoding='utf-8')
          replacements = [
              ('        versionCode 1\n', '        versionCode 2\n'),
              ('        versionName "1.0"\n', '        versionName "1.1-beta"\n'),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise RuntimeError(f'Expected exactly one match for {old!r}')
              source = source.replace(old, new, 1)
          build_gradle.write_text(source, encoding='utf-8')

          gitignore = Path('.gitignore')
          ignore_source = gitignore.read_text(encoding='utf-8')
          additions = ['live-update-output/', '.live-update-keys/', '*.pem']
          for addition in additions:
              if addition not in ignore_source.splitlines():
                  ignore_source += addition + '\n'
          gitignore.write_text(ignore_source, encoding='utf-8')
          PY

      - name: Run tests
        run: npm test

      - name: Run build
        run: npm run build

      - name: Run lint
        run: npm run lint

      - name: Sync Android
        run: npx cap sync android

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew clean assembleDebug

      - name: Verify Live Update setup
        shell: bash
        run: |
          grep -q '"@capawesome/capacitor-live-update": "8.3.0"' package.json
          grep -q "versionCode 2" android/app/build.gradle
          grep -q "readyTimeout: 10_000" capacitor.config.ts
          grep -q "LiveUpdate.ready" src/platform/liveUpdate.ts
          grep -q "LiveUpdate.downloadBundle" src/platform/liveUpdate.ts
          grep -q "LiveUpdate.setNextBundle" src/platform/liveUpdate.ts
          grep -q "northcore-eu.de/updates/asset-editor/beta/manifest.json" src/platform/liveUpdate.ts
          git diff --check

      - name: Commit setup to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .gitignore \
            package.json \
            package-lock.json \
            capacitor.config.ts \
            src/main.tsx \
            src/platform/liveUpdate.ts \
            scripts/create-beta-update.ps1 \
            scripts/sign-live-update-bundle.mjs \
            tests/liveUpdateManifest.test.ts \
            android/app/build.gradle \
            android/app/capacitor.build.gradle \
            android/capacitor.settings.gradle
          git commit -m "Selbst gehostete signierte Live-Updates vorbereiten"
          git push origin HEAD:main
